# Production stack for ONE small server (EC2 t4g.small). Run with:
#   docker compose --env-file .env.example.prod -f docker-compose.prod.yml up -d --build
name: suremedra

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }   # docker keeps at most 50 MB of logs per container

x-backend: &backend
  build: ./backend
  image: suremedra-backend:latest
  env_file: .env.example.prod
  restart: unless-stopped
  logging: *logging

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      REDIRECT_DOMAIN: ${REDIRECT_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates live here: do not delete
      - caddy_config:/config
    depends_on: [web, api]
    mem_limit: 128m
    logging: *logging

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        API_INTERNAL_URL: http://api:8000
    image: suremedra-frontend:latest
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
    mem_limit: 400m
    logging: *logging

  api:
    <<: *backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    mem_limit: 450m

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2", "--max-tasks-per-child=200"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    mem_limit: 350m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "80mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes: [redis_data:/data]
    mem_limit: 128m
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "work_mem=4MB", "-c", "log_min_duration_statement=500"]
    volumes:
      - /data/postgres:/var/lib/postgresql/data   # on the separate EBS data disk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 400m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  redis_data:
